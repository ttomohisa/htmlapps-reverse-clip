name: Deploy PR preview

on:
  pull_request:
    branches:
      - main
      - feat/reverse-clip-feasibility-v0.1
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}
  WRANGLER_VERSION: "4.135.0"

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      preview_url: ${{ steps.preview.outputs.preview_url }}
      mt_supported: ${{ steps.verify-headers.outputs.mt_supported }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Reverse timeline tests
        shell: pwsh
        run: node --test ./tests/feasibility/reverse-chunk-plan.test.mjs ./tests/feasibility/preview-mt-worker.test.mjs

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Verify pinned ST and MT runtime bytes
        shell: pwsh
        run: node --test ./tests/feasibility/threading-distribution.test.mjs ./tests/feasibility/release-lock-guard.test.mjs

      - name: Prepare multi-thread Preview isolation headers
        shell: pwsh
        run: |
          ./scripts/prepare-preview-headers.ps1
          node --test ./tests/feasibility/pages-dual-thread.test.mjs

      - name: Check Cloudflare preview credentials
        id: cloudflare
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -and
            -not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)

          "configured=$($configured.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if (-not $configured) {
            Write-Host "::notice::Cloudflare PR Preview skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          }

      - name: Create or update Cloudflare Preview
        id: preview
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $env:CLOUDFLARE_API_TOKEN = $env:CLOUDFLARE_API_TOKEN.Trim()
          $env:CLOUDFLARE_ACCOUNT_ID = $env:CLOUDFLARE_ACCOUNT_ID.Trim()
          $env:NO_COLOR = "1"

          if ($env:CLOUDFLARE_ACCOUNT_ID -notmatch '^[A-Za-z0-9_-]+$') {
            throw "CLOUDFLARE_ACCOUNT_ID contains invalid characters. Save only the Account ID value in the GitHub secret, without quotes or extra text."
          }

          $previewName = "r${{ github.event.repository.id }}-pr-${{ github.event.pull_request.number }}"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "wrangler-preview.json"
          $stderrPath = Join-Path $env:RUNNER_TEMP "wrangler-preview.stderr.log"

          Write-Host "Preview name: $previewName"

          $arguments = @(
            "--yes"
            "wrangler@$env:WRANGLER_VERSION"
            "preview"
            "--config"
            "wrangler.preview.jsonc"
            "--name"
            $previewName
            "--json"
          )

          $process = Start-Process -FilePath "npx.cmd" `
            -ArgumentList $arguments `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath

          if (Test-Path $stderrPath) {
            $stderrText = Get-Content -Raw -Encoding UTF8 $stderrPath
            if (-not [string]::IsNullOrWhiteSpace($stderrText)) {
              Write-Host $stderrText
            }
          }

          if ($process.ExitCode -ne 0) {
            throw "Cloudflare Preview deployment failed with exit code $($process.ExitCode)."
          }

          $stdoutBytes = [System.IO.File]::ReadAllBytes($stdoutPath)

          if ($stdoutBytes.Length -ge 2 -and $stdoutBytes[0] -eq 0xFF -and $stdoutBytes[1] -eq 0xFE) {
            $jsonText = [System.Text.Encoding]::Unicode.GetString($stdoutBytes)
          } elseif ($stdoutBytes.Length -ge 2 -and $stdoutBytes[0] -eq 0xFE -and $stdoutBytes[1] -eq 0xFF) {
            $jsonText = [System.Text.Encoding]::BigEndianUnicode.GetString($stdoutBytes)
          } else {
            $jsonText = [System.Text.Encoding]::UTF8.GetString($stdoutBytes)
          }

          $jsonStart = $jsonText.IndexOf('{')
          $jsonEnd = $jsonText.LastIndexOf('}')

          if ($jsonStart -lt 0 -or $jsonEnd -lt $jsonStart) {
            throw "Wrangler completed successfully but did not return a JSON object."
          }

          $jsonText = $jsonText.Substring($jsonStart, $jsonEnd - $jsonStart + 1)
          $result = $jsonText | ConvertFrom-Json
          $previewUrl = [string]$result.preview.urls[0]

          if ([string]::IsNullOrWhiteSpace($previewUrl)) {
            throw "Wrangler did not return a Preview URL."
          }

          "preview_url=$previewUrl" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "preview_name=$previewName" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Preview URL: $previewUrl"

      - name: Probe Preview
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          $lastError = $null

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $env:PREVIEW_URL -MaximumRedirection 5 -TimeoutSec 30

              if ($response.StatusCode -eq 200) {
                Write-Host "Preview returned HTTP 200."
                exit 0
              }

              $lastError = "HTTP $($response.StatusCode)"
            } catch {
              $lastError = $_.Exception.Message
            }

            Write-Host "Preview is not ready yet (attempt $attempt/12): $lastError"
            Start-Sleep -Seconds 5
          }

          throw "Preview did not become ready: $lastError"

      - name: Verify live ST Preview and report actual MT header capability
        id: verify-headers
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          $base = $env:PREVIEW_URL.TrimEnd('/')
          $st = Invoke-WebRequest -Uri "$base/" -MaximumRedirection 5 -TimeoutSec 30
          $mt = Invoke-WebRequest -Uri "$base/index.mt.html" -MaximumRedirection 5 -TimeoutSec 30
          if ($st.StatusCode -ne 200 -or $mt.StatusCode -ne 200) {
            throw "Preview did not return HTTP 200 for both ST and MT entries."
          }
          if ($st.Content -notmatch 'const RUNTIME_VARIANT = "single-thread";') {
            throw 'Root is not the ST standalone app.'
          }
          if ($mt.Content -notmatch 'const RUNTIME_VARIANT = "multi-thread";') {
            throw 'index.mt.html is not the actual MT standalone app.'
          }
          if ($st.Headers['Cross-Origin-Opener-Policy'] -or
              $st.Headers['Cross-Origin-Embedder-Policy']) {
            throw 'ST Preview should not receive MT COOP/COEP headers.'
          }
          $stWorker = [string]$st.Headers['X-RC-Preview-Worker']
          $mtWorker = [string]$mt.Headers['X-RC-Preview-Worker']
          Write-Host "Preview Worker trace: ST=$stWorker, MT=$mtWorker"
          if ($mtWorker -ne 'active') {
            Write-Warning 'MT Preview Worker did not execute (or proxy removed diagnostic header).'
          }
          $mtSupported = ($mtWorker -eq 'active')
          foreach ($header in @(
            @('Cross-Origin-Opener-Policy','same-origin'),
            @('Cross-Origin-Embedder-Policy','require-corp'),
            @('Cross-Origin-Resource-Policy','same-origin')
          )) {
            $value = [string]$mt.Headers[$header[0]]
            if ($value -ne $header[1]) {
              $mtSupported = $false
              Write-Warning "MT Preview cannot run: $($header[0]) requires $($header[1]), received '$value'."
            }
          }
          "mt_supported=$($mtSupported.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "[PASS] Cloudflare PR Preview ST root verified."
          if ($mtSupported) {
            Write-Host "MT response headers present; running the real Chrome MT smoke job."
          } else {
            Write-Host "::warning::Cloudflare Preview MT failed isolation check; DO NOT use MT URL for phone acceptance."
          }

      - name: Comment Preview URL
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview_name }}
          MT_SUPPORTED: ${{ steps.verify-headers.outputs.mt_supported }}
        run: |
          if ($env:MT_SUPPORTED -eq 'true') {
            $mtStatus = "**[最新版MT Previewを開く]($env:PREVIEW_URL/index.mt.html)** — COOP/COEP/CORP応答ヘッダーの確認済み。実際のMT動画変換は別のCIジョブで検証します。"
          } else {
            $mtStatus = "**MT Previewは未検証です。** ヘッダー確認に失敗したため、MT版の実機確認には使用しないでください。"
          }

          $body = @"
          ## Browser Kitty PR Preview

          **[ST Previewを開く]($env:PREVIEW_URL)**

          $mtStatus

          - Preview: ``$env:PREVIEW_NAME``
          - Commit: ``${{ github.event.pull_request.head.sha }}``
          - Hosting: Cloudflare Workers Preview

          このPRへ追加でpushすると同じPreview URLが最新版へ更新されます。PRを閉じるとPreviewは自動削除されます。
          "@

          gh pr comment "${{ github.event.pull_request.number }}" `
            --body $body `
            --edit-last `
            --create-if-none

  verify-live-mt:
    name: Real deployed Cloudflare MT MP4 (one-time proof)
    needs: preview
    if: ${{ needs.preview.outputs.preview_url != '' && needs.preview.outputs.mt_supported == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout actual PR sources
        uses: actions/checkout@v6
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install lightweight browser test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          command -v ffmpeg && command -v ffprobe || {
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          }
          python -m py_compile tests/feasibility/cloudflare-preview-mt-smoke.py
      - name: Verify actual deployed MT browser isolation and downloaded MP4
        shell: bash
        env:
          CHROMIUM_EXE: ${{ steps.chrome.outputs.chrome-path }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
        run: python tests/feasibility/cloudflare-preview-mt-smoke.py
