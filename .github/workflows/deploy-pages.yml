name: Deploy Reverse Clip experimental ST/MT to GitHub Pages

# Publication-only change: the app's v0.6 work stays in its Draft PR.
# Deploy an immutable, SHA-verified CI output rather than rebuilding an
# unfinished branch or depending on an expiring Builder WASM artifact.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "docs/PAGES_MT_TEST.md"
      - "tests/verify-published-pages.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "docs/PAGES_MT_TEST.md"
      - "tests/verify-published-pages.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      pages_ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - name: Checkout deployment code
        uses: actions/checkout@v6

      - name: Download immutable ST/MT Pages files from verified Reverse Clip CI
        uses: actions/download-artifact@v4
        with:
          repository: ttomohisa/htmlapps-reverse-clip
          run-id: 38498330193
          name: standalone-html-ebebaa12f85f8355cf47f0a79c04135d63860b58
          github-token: ${{ github.token }}
          path: .

      - name: Fail closed on wrong artifact bytes or wrong ST/MT layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "pages-dist/index.html": "96cbc5f7d08c4ae6c30682ce2d6b9d0d31fa233f405a9419f58802b2f7c23a5f",
              "pages-dist/mt/index.html": "9e5349eab193d09babd251d42b1aa344d32feedcd4961529c965f0ad201ce8b4",
              "pages-dist/mt/coi-serviceworker.js": "e97bbac6017322d48aa54a5bc7ce473c725a4b7376ff245002e0ba71c3dcdd7e",
          }
          for file, digest in expected.items():
              path = Path(file)
              assert path.is_file(), file
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == digest, (file, digest, actual)
              print("[PASS] Pinned distribution", file, actual)
          st = Path("pages-dist/index.html").read_text("utf-8")
          mt = Path("pages-dist/mt/index.html").read_text("utf-8")
          assert 'const RUNTIME_VARIANT = "single-thread";' in st
          assert 'const RUNTIME_VARIANT = "multi-thread";' in mt
          assert "coi-serviceworker.js" not in st
          assert 'sw.src = "./coi-serviceworker.js";' in mt
          assert "window.coi" in mt
          assert "connect-src 'none'" in st and "connect-src 'none'" in mt
          assert "v0.6.0" in st and "v0.6.0" in mt
          Path("pages-dist/.nojekyll").write_bytes(b"")
          print("[PASS] ST root and service-worker-isolated MT /mt/ layout")
          PY

      - name: Check whether repository GitHub Pages is enabled
        id: pages-status
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages enabled: continuing deployment."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### GitHub Pages needs one-time setup

          The pinned ST/MT app files and the /mt/ COI service worker were
          verified, but the repository GitHub Pages API is unavailable.

          1. Open **Settings → Pages** in ttomohisa/htmlapps-reverse-clip.
          2. Under **Build and deployment**, set **Source: GitHub Actions**.
          3. In **Actions**, re-run **Deploy Reverse Clip experimental ST/MT to GitHub Pages**.

          No source app PR or Builder PR needs to be merged to do this.
          EOF
            echo "::warning::GitHub Pages not enabled; skip upload/deploy until Pages source is GitHub Actions."
          fi

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload source-verified ST/MT GitHub Pages artifact
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pinned experimental app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live-mt:
    name: Confirm real published /mt/ isolation and MP4 export
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Pages verifier
        uses: actions/checkout@v6
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          command -v ffmpeg && command -v ffprobe || {
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          }
          python -m py_compile tests/verify-published-pages.py
      - name: Verify real deployed Pages MT in Chrome
        shell: bash
        env:
          CHROMIUM_EXE: ${{ steps.chrome.outputs.chrome-path }}
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tests/verify-published-pages.py
